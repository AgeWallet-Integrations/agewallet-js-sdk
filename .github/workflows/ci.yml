name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer run on the same branch or pull request cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    # Runs on the organisation repo only, never on personal forks.
    if: github.repository == 'AgeWallet-Integrations/agewallet-js-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        if: matrix.node != '24'
        run: npx vitest run

      - name: Test with coverage
        if: matrix.node == '24'
        run: |
          npx vitest run --coverage
          { echo '### Coverage'; echo '```'; cat coverage/coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The files published to npm: dist/agewallet.js, agewallet.umd.cjs and agewallet.min.js
      - name: Build the npm package
        run: npm run build:lib

  # One check for the main ruleset to require: passes only when every Node version passed.
  tests:
    name: Tests
    if: always() && github.repository == 'AgeWallet-Integrations/agewallet-js-sdk'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All Node versions passed
        run: test "${{ needs.test.result }}" = "success"
